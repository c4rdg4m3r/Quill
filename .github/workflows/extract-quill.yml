name: Extract Quill website
on:
  push:
    paths:
      - ".github/workflows/extract-quill.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract website files
        run: |
          if [ -f quill-learning-website.zip ]; then
            unzip -o quill-learning-website.zip -d .
            rm quill-learning-website.zip
          fi
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract Quill website files"
            git push
          fi
