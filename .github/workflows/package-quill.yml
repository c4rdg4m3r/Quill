name: Package extracted Quill source
on:
  push:
    paths:
      - ".github/workflows/package-quill.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website
        run: unzip -o quill-learning-website.zip -d extracted
      - uses: actions/upload-artifact@v4
        with:
          name: quill-source
          path: extracted/quill-learning/
